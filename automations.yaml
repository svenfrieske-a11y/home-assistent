- id: '1792740785491'
  alias: Absenkung
  description: Absenkung in Abhängigkeit vom Zeitplan und nur bei no Frostschutz
  triggers:
  - entity_id: schedule.wochenzeitplan
    to: 'on'
    id: start
    trigger: state
  - entity_id: schedule.wochenzeitplan
    to: 'off'
    id: stop
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.frostschutz
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zieltemperatur
        data:
          value: '{{ states(''input_number.absenktemperatur'') | float(0) }}'
      - action: notify.notify
        data:
          title: Absenkung aktiviert
          message: 'Wert: {{ states(''input_number.zieltemperatur'') }}°C'
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zieltemperatur
        data:
          value: '{{ states(''input_number.tagestemperatur'') | float(0) }}'
      - action: notify.notify
        data:
          title: Absenkung deaktiviert
          message: 'Wert: {{ states(''input_number.zieltemperatur'') }}°C'
  mode: single
- id: '1792752343213'
  alias: Frostschutz
  description: Änderung der Zieltemperatur in Abhängigkeit vom Schalter "Frostschutz"
  triggers:
  - entity_id:
    - input_boolean.frostschutz
    to:
    - 'on'
    id: fson
    trigger: state
  - entity_id:
    - input_boolean.frostschutz
    to:
    - 'off'
    id: fsoff
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fson
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zieltemperatur
        data:
          value: 5
    - conditions:
      - condition: trigger
        id: fsoff
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zieltemperatur
        data:
          value: '{{ states(''input_number.tagestemperatur'') | float(0) }}'
  mode: single
- id: '1793368778191'
  alias: Lokal
  description: Schaltet Klimaanlage temperaturabhängig ein und aus
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.sonoff_th2_temperatur'') | float(0) < (states(''input_number.zieltemperatur'')
      | float(0) - 0.5) }}'
    id: heizen_an
  - trigger: template
    value_template: '{{ states(''sensor.sonoff_th2_temperatur'') | float(0) > (states(''input_number.zieltemperatur'')
      | float(0) + 0.5) }}'
    id: heizen_aus
  - trigger: state
    entity_id: automation.lokal
    to: 'on'
    id: switched_on
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: switched_on
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.tado
    - conditions:
      - condition: trigger
        id: heizen_an
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.split_lokal
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        target:
          entity_id: climate.split_lokal
        data:
          temperature: 24
      - action: climate.set_fan_mode
        target:
          entity_id: climate.split_lokal
        data:
          fan_mode: low
      - action: climate.set_swing_mode
        target:
          entity_id: climate.split_lokal
        data:
          swing_mode: 'off'
      - action: climate.set_horizontal_swing_mode
        target:
          entity_id: climate.split_lokal
        data:
          horizontal_swing_mode: 'off'
      - action: notify.notify
        data:
          title: Klimaanlage eingeschaltet
          message: 'Wert: {{ states(''sensor.sonoff_th2_temperatur'') }}°C'
    - conditions:
      - condition: trigger
        id: heizen_aus
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.split_lokal
        data:
          hvac_mode: 'off'
      - action: notify.notify
        data:
          title: Klimaanlage ausgeschaltet
          message: 'Wert: {{ states(''sensor.sonoff_th2_temperatur'') }}°C'
  mode: restart
- id: '1793368929442'
  alias: Tado
  description: Schaltet Klimaanlage lokal und temperaturabhängig basierend auf Tado-Werten
    mit Hysterese
  triggers:
  - trigger: template
    value_template: "{{ states('climate.tado_smart_thermostat_ru3295939584') != 'unknown'
      and \n   (states('sensor.tado_smart_thermostat_ru3295939584_current_temperature')
      | float(0)) < \n   ((state_attr('climate.tado_smart_thermostat_ru3295939584',
      'temperature') | float(5.0)) - 0.5) }}"
    id: heizen_an
  - trigger: template
    value_template: "{{ (states('sensor.tado_smart_thermostat_ru3295939584_current_temperature')
      | float(0)) > \n   ((state_attr('climate.tado_smart_thermostat_ru3295939584',
      'temperature') | float(5.0)) + 0.5) }}"
    id: heizen_aus
  - trigger: state
    entity_id: automation.tado
    to: 'on'
    id: switched_on
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: switched_on
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.lokal
    - conditions:
      - condition: trigger
        id: heizen_an
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.split_lokal
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        target:
          entity_id: climate.split_lokal
        data:
          temperature: 24
      - action: climate.set_fan_mode
        target:
          entity_id: climate.split_lokal
        data:
          fan_mode: low
      - action: climate.set_swing_mode
        target:
          entity_id: climate.split_lokal
        data:
          swing_mode: 'off'
      - action: climate.set_horizontal_swing_mode
        target:
          entity_id: climate.split_lokal
        data:
          horizontal_swing_mode: 'off'
      - action: notify.notify
        data:
          title: Klimaanlage eingeschaltet
          message: 'Tado Lokal gesteuert. Ist-Wert: {{ states(''sensor.tado_smart_thermostat_ru3295939584_current_temperature'')
            }}°C (Ziel am Thermostat: {{ state_attr(''climate.tado_smart_thermostat_ru3295939584'',
            ''temperature'') }}°C)'
    - conditions:
      - condition: trigger
        id: heizen_aus
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.split_lokal
        data:
          hvac_mode: 'off'
      - action: notify.notify
        data:
          title: Klimaanlage ausgeschaltet
          message: Tado Lokal gesteuert. Thermostat ausgeschaltet oder Zieltemperatur
            erreicht.
  mode: restart
