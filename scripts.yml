klima_an:
  alias: "Zentral: Klimaanlage Heizen Ein"
  fields:
    nachricht:
      description: "Text für die Benachrichtigung"
    send_notify:
      description: "Benachrichtigung senden (true/false)"
      default: true
    use_swing:
      description: "Swing aktivieren (true/false)"
      default: true
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.split_lokal
      data:
        hvac_mode: heat
    - action: climate.set_temperature
      target:
        entity_id: climate.split_lokal
      data:
        temperature: 24
    - action: climate.set_fan_mode
      target:
        entity_id: climate.split_lokal
      data:
        fan_mode: low
    - if:
        - condition: template
          value_template: "{{ use_swing | default(true) }}"
      then:
        - action: climate.set_swing_mode
          target:
            entity_id: climate.split_lokal
          data:
            swing_mode: "off"
        - action: climate.set_swing_horizontal_mode
          target:
            entity_id: climate.split_lokal
          data:
            swing_horizontal_mode: "on"
    - delay: "00:00:01"
    - action: light.turn_off
      target:
        entity_id: light.split_lokal_anzeige
    - if:
        - condition: template
          value_template: "{{ (state_attr('climate.tado_smart_thermostat_ru3295939584', 'temperature') | float(0)) > 6 and (now().hour >= 22 or now().hour < 7) }}"
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.split_lokal_schlafen
      else:
        - action: switch.turn_off
          target:
            entity_id: switch.split_lokal_schlafen
klima_aus:
  alias: "Zentral: Klimaanlage Aus"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.split_lokal
      data:
        hvac_mode: "off"
    - action: light.turn_off
      target:
        entity_id: light.split_lokal_anzeige
    - action: switch.turn_off
      target:
        entity_id: switch.split_lokal_schlafen
    - action: notify.mobile_app_xiaomi_13t
      data:
        title: Klimaanlage ausgeschaltet
        message: "{{ nachricht }}"
klima_standby:
  alias: "Zentral: Klimaanlage Standby"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.split_lokal
      data:
        hvac_mode: heat
    - action: climate.set_temperature
      target:
        entity_id: climate.split_lokal
      data:
        temperature: 16
    - action: light.turn_off
      target:
        entity_id: light.split_lokal_anzeige
    - if:
        - condition: template
          value_template: "{{ (state_attr('climate.tado_smart_thermostat_ru3295939584', 'temperature') | float(0)) > 6 and (now().hour >= 22 or now().hour < 7) }}"
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.split_lokal_schlafen
      else:
        - action: switch.turn_off
          target:
            entity_id: switch.split_lokal_schlafen
