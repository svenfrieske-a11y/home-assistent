id: '1793368778191'
alias: Lokal
description: Schaltet Klimaanlage temperaturabhängig ein und aus
triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.sonoff_th2_temperatur') | float(0) <
      (states('input_number.zieltemperatur') | float(0) - 0.5) }}
    id: heizen_an
  - trigger: template
    value_template: >-
      {{ states('sensor.sonoff_th2_temperatur') | float(0) >
      (states('input_number.zieltemperatur') | float(0) + 0.5) }}
    id: heizen_aus
  - trigger: state
    entity_id: automation.lokal
    to: 'on'
    id: switched_on
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: switched_on
        sequence:
          - action: automation.turn_off
            target:
              entity_id: automation.tado
      - conditions:
          - condition: trigger
            id: heizen_an
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.split_lokal
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: climate.split_lokal
            data:
              temperature: 24
          - action: climate.set_fan_mode
            target:
              entity_id: climate.split_lokal
            data:
              fan_mode: low
          - action: climate.set_swing_mode
            target:
              entity_id: climate.split_lokal
            data:
              swing_mode: 'off'
          - action: climate.set_horizontal_swing_mode
            target:
              entity_id: climate.split_lokal
            data:
              horizontal_swing_mode: 'off'
          - action: notify.notify
            data:
              title: Klimaanlage eingeschaltet
              message: 'Wert: {{ states(''sensor.sonoff_th2_temperatur'') }}°C'
      - conditions:
          - condition: trigger
            id: heizen_aus
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.split_lokal
            data:
              hvac_mode: 'off'
          - action: notify.notify
            data:
              title: Klimaanlage ausgeschaltet
              message: 'Wert: {{ states(''sensor.sonoff_th2_temperatur'') }}°C'
mode: restart
