id: "1793368778191"
alias: Lokal
description: Schaltet Klimaanlage temperaturabhängig ein und aus
triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.sonoff_th2_temperatur') | float(0) <
      (states('input_number.zieltemperatur') | float(0) - 0.5) }}
    id: heizen_an
  - trigger: template
    value_template: >-
      {{ states('sensor.sonoff_th2_temperatur') | float(0) >
      (states('input_number.zieltemperatur') | float(0) + 0.5) }}
    id: heizen_aus
  - trigger: state
    entity_id: automation.lokal
    to: "on"
    id: switched_on
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: switched_on
        sequence:
          - action: automation.turn_off
            target:
              entity_id: automation.tado
      - conditions:
          - condition: trigger
            id: heizen_an
        sequence:
          - action: script.klima_an
            data:
              nachricht: "Wert: {{ states('sensor.sonoff_th2_temperatur') }}°C"
      - conditions:
          - condition: trigger
            id: heizen_aus
        sequence:
          - action: script.klima_aus
            data:
              nachricht: "Wert: {{ states('sensor.sonoff_th2_temperatur') }}°C"
mode: restart
