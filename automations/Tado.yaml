id: "1793368929442"
alias: Tado
description: Schaltet Klimaanlage lokal und temperaturabhängig basierend auf Tado-Werten mit Hysterese
triggers:
  - trigger: template
    value_template: >-
      {% set ist = states('sensor.tado_smart_thermostat_ru3295939584_current_temperature') %}
      {% set soll = state_attr('climate.tado_smart_thermostat_ru3295939584', 'temperature') %}
      {{ is_state('climate.tado_smart_thermostat_ru3295939584', 'heat')
         and is_number(ist) and is_number(soll)
         and (ist | float) <= ((soll | float) - 0.5) }}
    id: heizen_an
  - trigger: template
    value_template: >-
      {% set ist = states('sensor.tado_smart_thermostat_ru3295939584_current_temperature') %}
      {% set soll = state_attr('climate.tado_smart_thermostat_ru3295939584', 'temperature') %}
      {{ is_number(ist) and is_number(soll)
         and (ist | float) >= ((soll | float) + 0.5) }}
    id: heizen_aus
  - trigger: state
    entity_id: automation.tado
    to: "on"
    id: switched_on
conditions: []
actions:
  - if:
      - condition: trigger
        id: switched_on
    then:
      - action: automation.turn_off
        target:
          entity_id: automation.lokal
  - choose:
      - conditions:
          - or:
              - condition: trigger
                id: heizen_an
              - and:
                  - condition: trigger
                    id: switched_on
                  - condition: template
                    value_template: >-
                      {% set ist = states('sensor.tado_smart_thermostat_ru3295939584_current_temperature') %}
                      {% set soll = state_attr('climate.tado_smart_thermostat_ru3295939584', 'temperature') %}
                      {{ is_state('climate.tado_smart_thermostat_ru3295939584', 'heat')
                         and is_number(ist) and is_number(soll)
                         and (ist | float) <= ((soll | float) - 0.5) }}
        sequence:
          - action: script.klima_an
            data:
              nachricht: >-
                Tado Lokal gesteuert. Ist-Wert: {{
                states('sensor.tado_smart_thermostat_ru3295939584_current_temperature')
                }}°C (Ziel am Thermostat: {{
                state_attr('climate.tado_smart_thermostat_ru3295939584',
                'temperature') }}°C)
      - conditions:
          - condition: trigger
            id: heizen_aus
        sequence:
          - action: script.klima_aus
            data:
              nachricht: "Tado Lokal gesteuert. Thermostat ausgeschaltet oder Zieltemperatur erreicht."
mode: restart
